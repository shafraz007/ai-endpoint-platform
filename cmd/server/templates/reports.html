<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Execution Reports</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --bg-1: #0c2d24;
            --bg-2: #0f4c5c;
            --accent: #ff9f1c;
            --accent-soft: #ffe8c2;
            --surface: #ffffff;
            --ink: #1f2933;
            --muted: #5f6c75;
            --line: #e6eaed;
            --shadow: rgba(0, 0, 0, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', 'Trebuchet MS', sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--ink);
        }

        .container { width: 100%; max-width: none; margin: 0 auto; }

        header {
            background: var(--surface);
            padding: 24px 30px;
            border-radius: 12px;
            box-shadow: 0 6px 14px var(--shadow);
            margin-bottom: 24px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-actions { display: flex; gap: 10px; }

        .ghost-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent-soft);
            padding: 8px 14px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .section {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 6px 14px var(--shadow);
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
            display: block;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            font-family: inherit;
            font-size: 14px;
        }

        .button-row { display: flex; gap: 10px; justify-content: flex-end; }

        button {
            background: var(--accent);
            color: #1f2933;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--ink);
            font-weight: 600;
        }

        #status {
            display: none;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        #status.ok { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        #status.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        table { width: 100%; border-collapse: collapse; }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
            font-size: 12px;
        }

        th {
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--muted);
            font-size: 11px;
        }

        .mono {
            font-family: Consolas, 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 320px;
        }

        .pill {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: lowercase;
        }

        .pill-ok { background: #dcfce7; color: #166534; }
        .pill-fail { background: #fee2e2; color: #991b1b; }
        .pill-other { background: #e2e8f0; color: #334155; }

        .muted { color: var(--muted); }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 8px 12px;
            border-radius: 999px;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #1f2933;
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div>
                    <h1>Schedule Execution Reports</h1>
                    <div class="muted">{{.Now}}</div>
                </div>
                <div class="nav-actions">
                    <a class="ghost-btn" href="/agents">Agents</a>
                    <a class="ghost-btn" href="/settings">Settings</a>
                </div>
            </div>
        </header>

        <section class="section">
            <div id="status"></div>
            <div class="tabs">
                <button class="tab-btn active" type="button" data-tab="executions" onclick="switchTab('executions')">Schedule Executions</button>
                <button class="tab-btn" type="button" data-tab="self-updates" onclick="switchTab('self-updates')">Self Update History</button>
                <button class="tab-btn" type="button" data-tab="rollout" onclick="switchTab('rollout')">OS Patch Rollout</button>
            </div>

            <div id="panel-executions" class="tab-panel active">
                <div class="form-grid">
                    <div>
                        <label for="from">From</label>
                        <input id="from" type="datetime-local">
                    </div>
                    <div>
                        <label for="to">To</label>
                        <input id="to" type="datetime-local">
                    </div>
                    <div>
                        <label for="schedule-id">Schedule</label>
                        <select id="schedule-id"></select>
                    </div>
                    <div>
                        <label for="group-id">Group</label>
                        <select id="group-id"></select>
                    </div>
                    <div>
                        <label for="agent-id">Agent ID</label>
                        <input id="agent-id" placeholder="optional exact agent id">
                    </div>
                    <div>
                        <label for="limit">Limit</label>
                        <input id="limit" type="number" min="1" max="2000" value="300">
                    </div>
                </div>
                <div class="button-row">
                    <button class="secondary" type="button" onclick="resetFilters()">Reset</button>
                    <button type="button" onclick="loadReports()">Run Report</button>
                </div>
                <div style="margin-top:12px;">
                    <table id="report-table"></table>
                </div>
            </div>

            <div id="panel-self-updates" class="tab-panel">
                <div class="form-grid">
                    <div>
                        <label for="su-from">From</label>
                        <input id="su-from" type="datetime-local">
                    </div>
                    <div>
                        <label for="su-to">To</label>
                        <input id="su-to" type="datetime-local">
                    </div>
                    <div>
                        <label for="su-status">Status</label>
                        <input id="su-status" placeholder="queued, running, succeeded, failed">
                    </div>
                    <div>
                        <label for="su-target-version">Target Version</label>
                        <input id="su-target-version" placeholder="e.g. 1.0.8">
                    </div>
                    <div>
                        <label for="su-agent-id">Agent ID</label>
                        <input id="su-agent-id" placeholder="optional exact agent id">
                    </div>
                    <div>
                        <label for="su-hostname">Hostname</label>
                        <input id="su-hostname" placeholder="optional hostname substring">
                    </div>
                    <div>
                        <label for="su-limit">Limit</label>
                        <input id="su-limit" type="number" min="1" max="2000" value="200">
                    </div>
                </div>
                <div class="button-row">
                    <button class="secondary" type="button" onclick="resetSelfUpdateFilters()">Reset</button>
                    <button type="button" onclick="loadSelfUpdateReports()">Run Report</button>
                </div>
                <div style="margin-top:12px;">
                    <table id="self-update-table"></table>
                </div>
            </div>

            <div id="panel-rollout" class="tab-panel">
                <h2 style="margin-bottom:10px; font-size:1.05em;">OS Patch Rollout Telemetry</h2>
                <div class="button-row" style="margin-bottom:10px;">
                    <button class="secondary" type="button" onclick="loadRolloutTelemetry()">Refresh Rollout Telemetry</button>
                </div>
                <div id="rollout-summary" class="muted" style="margin-bottom:10px;">No rollout telemetry loaded yet.</div>
                <table id="rollout-ring-table" style="margin-bottom:12px;"></table>
                <table id="rollout-recent-table"></table>
            </div>
        </section>
    </div>

    <script>
        const DISPLAY_TIMEZONE = {{if .DisplayTimezone}}"{{.DisplayTimezone}}"{{else}}null{{end}};

        function formatTimestamp(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '-';
            const opts = { year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' };
            if (DISPLAY_TIMEZONE) opts.timeZone = DISPLAY_TIMEZONE;
            return date.toLocaleString(undefined, opts);
        }

        const api = {
            schedules: '/api/schedules?limit=500',
            groups: '/api/groups',
			reports: '/api/reports/executions',
			selfUpdates: '/api/reports/self-updates',
			rolloutTelemetry: '/api/reports/os-patch-rollout?limit=50'
        };

        function switchTab(name) {
            const buttons = Array.from(document.querySelectorAll('.tab-btn'));
            buttons.forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-tab') === name);
            });

            const panels = {
                executions: document.getElementById('panel-executions'),
                'self-updates': document.getElementById('panel-self-updates'),
                rollout: document.getElementById('panel-rollout')
            };
            Object.keys(panels).forEach(key => {
                const panel = panels[key];
                if (!panel) return;
                panel.classList.toggle('active', key === name);
            });
        }

        function showStatus(message, type) {
            const el = document.getElementById('status');
            if (!el) return;
            if (!message) {
                el.className = '';
                el.style.display = 'none';
                el.textContent = '';
                return;
            }
            el.className = type === 'error' ? 'error' : 'ok';
            el.textContent = message;
        }

        async function apiFetch(url) {
            const response = await fetch(url, { credentials: 'same-origin' });
            if (response.status === 401) {
                window.location.href = '/session-timeout?next=' + encodeURIComponent('/reports');
                return [];
            }
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return await response.json();
        }

        function optionize(select, items, placeholder) {
            select.innerHTML = '';
            const empty = document.createElement('option');
            empty.value = '';
            empty.textContent = placeholder;
            select.appendChild(empty);
            (items || []).forEach(item => {
                const option = document.createElement('option');
                option.value = String(item.id);
                option.textContent = item.name || ('#' + item.id);
                select.appendChild(option);
            });
        }

        function localDateTimeValue(date) {
            const d = new Date(date.getTime() - (date.getTimezoneOffset() * 60000));
            return d.toISOString().slice(0, 16);
        }

        function resetFilters() {
            const now = new Date();
            const from = new Date(now.getTime() - 24 * 60 * 60 * 1000);
            document.getElementById('from').value = localDateTimeValue(from);
            document.getElementById('to').value = localDateTimeValue(now);
            document.getElementById('schedule-id').value = '';
            document.getElementById('group-id').value = '';
            document.getElementById('agent-id').value = '';
            document.getElementById('limit').value = '300';
            showStatus('', 'ok');
        }

        function resetSelfUpdateFilters() {
            const now = new Date();
            const from = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
            document.getElementById('su-from').value = localDateTimeValue(from);
            document.getElementById('su-to').value = localDateTimeValue(now);
            document.getElementById('su-status').value = '';
            document.getElementById('su-target-version').value = '';
            document.getElementById('su-agent-id').value = '';
            document.getElementById('su-hostname').value = '';
            document.getElementById('su-limit').value = '200';
            showStatus('', 'ok');
        }

        function badgeClass(status) {
            const s = (status || '').toLowerCase();
            if (s === 'succeeded' || s === 'completed') return 'pill pill-ok';
            if (s === 'failed') return 'pill pill-fail';
            return 'pill pill-other';
        }

        function renderTable(rows) {
            const table = document.getElementById('report-table');
            if (!rows || rows.length === 0) {
                table.innerHTML = '<thead><tr><th>No records</th></tr></thead><tbody><tr><td class="muted">No schedule executions found for selected filters.</td></tr></tbody>';
                return;
            }

            const header = [
                'Created', 'Schedule', 'Target', 'Agent', 'Command', 'Status', 'Schedule Payload', 'Command Payload', 'Output', 'Error'
            ];
            let html = '<thead><tr>' + header.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>';

            rows.forEach(item => {
                const target = item.target_scope === 'group'
                    ? ('Group #' + (item.target_group_id || '-') + (item.target_group_name ? (' (' + item.target_group_name + ')') : ''))
                    : ('Agent ' + (item.target_agent_id || '-'));
                const agent = item.agent_hostname ? (item.agent_hostname + ' (' + item.agent_id + ')') : item.agent_id;
                html += '<tr>' +
                    '<td>' + formatTimestamp(item.created_at) + '</td>' +
                    '<td>#' + item.schedule_id + ' - ' + (item.schedule_name || '') + '</td>' +
                    '<td>' + target + '</td>' +
                    '<td class="mono">' + (agent || '') + '</td>' +
                    '<td>' + (item.command_type || '') + '</td>' +
                    '<td><span class="' + badgeClass(item.status) + '">' + (item.status || '') + '</span></td>' +
                    '<td class="mono">' + (item.schedule_payload || '') + '</td>' +
                    '<td class="mono">' + (item.command_payload || '') + '</td>' +
                    '<td class="mono">' + (item.output || '') + '</td>' +
                    '<td class="mono">' + (item.error || '') + '</td>' +
                    '</tr>';
            });

            html += '</tbody>';
            table.innerHTML = html;
        }

        function renderRolloutTable(tableId, headers, rows) {
            const table = document.getElementById(tableId);
            if (!table) return;
            if (!rows || rows.length === 0) {
                table.innerHTML = '<thead><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody><tr><td colspan="' + headers.length + '" class="muted">No data.</td></tr></tbody>';
                return;
            }

            let html = '<thead><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>';
            rows.forEach(row => {
                html += '<tr>' + row.map(cell => '<td>' + cell + '</td>').join('') + '</tr>';
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        function renderSelfUpdateTable(rows) {
            const table = document.getElementById('self-update-table');
            if (!rows || rows.length === 0) {
                table.innerHTML = '<thead><tr><th>No records</th></tr></thead><tbody><tr><td class="muted">No self update history found for selected filters.</td></tr></tbody>';
                return;
            }

            const header = ['Queued', 'Completed', 'Agent', 'Command', 'Target Version', 'Status', 'Output', 'Error'];
            let html = '<thead><tr>' + header.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>';
            rows.forEach(item => {
                const agent = item.agent_hostname
                    ? (item.agent_hostname + ' (' + (item.agent_id || '-') + ')')
                    : String(item.agent_id || '-');
                html += '<tr>' +
                    '<td>' + (item.queued_at ? formatTimestamp(item.queued_at) : '-') + '</td>' +
                    '<td>' + (item.completed_at ? formatTimestamp(item.completed_at) : '-') + '</td>' +
                    '<td class="mono">' + agent + '</td>' +
                    '<td>' + (item.command_id ? ('#' + item.command_id) : '-') + '</td>' +
                    '<td>' + (item.target_version || '') + '</td>' +
                    '<td><span class="' + badgeClass(item.status) + '">' + (item.status || '') + '</span></td>' +
                    '<td class="mono">' + (item.output || '') + '</td>' +
                    '<td class="mono">' + (item.error || '') + '</td>' +
                    '</tr>';
            });
            html += '</tbody>';
            table.innerHTML = html;
        }

        function formatRolloutGateState(value) {
            const state = String(value || '').toLowerCase();
            if (!state) return 'unknown';
            return state.replace(/_/g, ' ');
        }

        async function loadRolloutTelemetry() {
            try {
                const data = await apiFetch(api.rolloutTelemetry);
                const policy = data.policy || {};
                const health = data.health_snapshot || {};
                const summaryEl = document.getElementById('rollout-summary');
                if (summaryEl) {
                    summaryEl.textContent =
                        'Gate: ' + formatRolloutGateState(data.gate_state) +
                        ' • Active ring ' + (policy.active_ring || '-') + '/' + (policy.ring_count || '-') +
                        ' (effective ' + (data.effective_active_ring || '-') + ')' +
                        ' • Failure ' + Number(health.failure_rate_pct || 0).toFixed(1) + '% (' + (health.failures || 0) + '/' + (health.samples || 0) + ')' +
                        ' • Generated ' + formatTimestamp(data.generated_at);
                }

                const ringRows = (data.ring_summary || []).map(item => [
                    String(item.ring || '-'),
                    String(item.agent_count || 0),
                    String(item.install_open || 0)
                ]);
                renderRolloutTable('rollout-ring-table', ['Ring', 'Agents', 'Install Open'], ringRows);

                const recentRows = (data.recent_installs || []).map(item => [
                    formatTimestamp(item.created_at),
                    '#' + item.command_id,
                    String(item.agent_id || '-'),
                    String(item.hostname || '-'),
                    String(item.ring || '-'),
                    '<span class="' + badgeClass(item.status) + '">' + String(item.status || '') + '</span>'
                ]);
                renderRolloutTable('rollout-recent-table', ['Created', 'Command', 'Agent', 'Hostname', 'Ring', 'Status'], recentRows);
            } catch (error) {
                const summaryEl = document.getElementById('rollout-summary');
                if (summaryEl) {
                    summaryEl.textContent = 'Failed to load rollout telemetry: ' + error.message;
                }
                renderRolloutTable('rollout-ring-table', ['Ring', 'Agents', 'Install Open'], []);
                renderRolloutTable('rollout-recent-table', ['Created', 'Command', 'Agent', 'Hostname', 'Ring', 'Status'], []);
            }
        }

        function buildQuery() {
            const from = document.getElementById('from').value;
            const to = document.getElementById('to').value;
            const scheduleId = document.getElementById('schedule-id').value;
            const groupId = document.getElementById('group-id').value;
            const agentId = (document.getElementById('agent-id').value || '').trim();
            const limit = document.getElementById('limit').value;

            const params = new URLSearchParams();
            if (from) params.set('from', localDateTimeInputToRFC3339(from));
            if (to) params.set('to', localDateTimeInputToRFC3339(to));
            if (scheduleId) params.set('schedule_id', scheduleId);
            if (groupId) params.set('group_id', groupId);
            if (agentId) params.set('agent_id', agentId);
            if (limit) params.set('limit', limit);
            return params.toString();
        }

        function localDateTimeInputToRFC3339(value) {
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime())) {
                return value;
            }
            return parsed.toISOString();
        }

        function buildSelfUpdateQuery() {
            const from = document.getElementById('su-from').value;
            const to = document.getElementById('su-to').value;
            const status = (document.getElementById('su-status').value || '').trim().toLowerCase();
            const targetVersion = (document.getElementById('su-target-version').value || '').trim();
            const agentId = (document.getElementById('su-agent-id').value || '').trim();
            const hostname = (document.getElementById('su-hostname').value || '').trim();
            const limit = document.getElementById('su-limit').value;

            const params = new URLSearchParams();
            if (from) params.set('from', localDateTimeInputToRFC3339(from));
            if (to) params.set('to', localDateTimeInputToRFC3339(to));
            if (status) params.set('status', status);
            if (targetVersion) params.set('target_version', targetVersion);
            if (agentId) params.set('agent_id', agentId);
            if (hostname) params.set('hostname', hostname);
            if (limit) params.set('limit', limit);
            return params.toString();
        }

        async function loadLookups() {
            const [schedules, groups] = await Promise.all([
                apiFetch(api.schedules).catch(() => []),
                apiFetch(api.groups).catch(() => [])
            ]);
            optionize(document.getElementById('schedule-id'), schedules, 'All schedules');
            optionize(document.getElementById('group-id'), groups, 'All groups');
        }

        async function loadReports() {
            try {
                showStatus('Loading report...', 'ok');
                const query = buildQuery();
                const data = await apiFetch(api.reports + (query ? ('?' + query) : ''));
                renderTable(data || []);
                showStatus('Loaded ' + (data ? data.length : 0) + ' execution records.', 'ok');
            } catch (error) {
                renderTable([]);
                showStatus('Failed to load report: ' + error.message, 'error');
            }
        }

        async function loadSelfUpdateReports() {
            try {
                showStatus('Loading self update history...', 'ok');
                const query = buildSelfUpdateQuery();
                const data = await apiFetch(api.selfUpdates + (query ? ('?' + query) : ''));
                renderSelfUpdateTable(data || []);
                showStatus('Loaded ' + (data ? data.length : 0) + ' self update records.', 'ok');
            } catch (error) {
                renderSelfUpdateTable([]);
                showStatus('Failed to load self update history: ' + error.message, 'error');
            }
        }

        (async function init() {
            resetFilters();
            resetSelfUpdateFilters();
            await loadLookups();
            await loadRolloutTelemetry();
            await loadReports();
            await loadSelfUpdateReports();
        })();
    </script>
</body>
</html>
